<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Subtle Outer Coordinate Ring -->
  <circle cx="256" cy="256" r="180" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 8"/>
  <circle cx="256" cy="256" r="150" stroke="#1e293b" stroke-width="2"/>

  <!-- Compass / Reticle Crosshairs -->
  <line x1="256" y1="64" x2="256" y2="100" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="412" x2="256" y2="448" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="256" x2="100" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <line x1="412" y1="256" x2="448" y2="256" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Camera Shutter / Panorama Aperture Blades -->
  <path d="M 256 126 A 130 130 0 0 1 370 190 L 320 220 A 75 75 0 0 0 256 181 Z" fill="#1e293b"/>
  <path d="M 370 190 A 130 130 0 0 1 386 320 L 328 285 A 75 75 0 0 0 331 220 Z" fill="#243247"/>
  <path d="M 386 320 A 130 130 0 0 1 290 384 L 275 326 A 75 75 0 0 0 328 285 Z" fill="#1e293b"/>
  <path d="M 290 384 A 130 130 0 0 1 156 350 L 195 304 A 75 75 0 0 0 275 326 Z" fill="#243247"/>
  <path d="M 156 350 A 130 130 0 0 1 126 220 L 183 238 A 75 75 0 0 0 195 304 Z" fill="#1e293b"/>
  <path d="M 126 220 A 130 130 0 0 1 220 130 L 220 188 A 75 75 0 0 0 183 238 Z" fill="#243247"/>

  <!-- Dial Markers (Hours/Seconds) -->
  <circle cx="256" cy="136" r="5" fill="#94a3b8"/>
  <circle cx="341" cy="171" r="4" fill="#64748b"/>
  <circle cx="376" cy="256" r="5" fill="#94a3b8"/>
  <circle cx="341" cy="341" r="4" fill="#64748b"/>
  <circle cx="256" cy="376" r="5" fill="#94a3b8"/>
  <circle cx="171" cy="341" r="4" fill="#64748b"/>
  <circle cx="136" cy="256" r="5" fill="#94a3b8"/>
  <circle cx="171" cy="171" r="4" fill="#64748b"/>

  <!-- Inner Chronometer Core -->
  <circle cx="256" cy="256" r="68" fill="#0d111a" stroke="url(#cyanGrad)" stroke-width="4"/>

  <!-- Precision Clock Hands (Hour, Minute, and Second) -->
  <!-- Minute Hand pointing upper-right -->
  <line x1="256" y1="256" x2="305" y2="207" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <!-- Hour Hand pointing down-right -->
  <line x1="256" y1="256" x2="280" y2="280" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
  <!-- Second Hand (Precision Chrono) in Emerald pointing up-left -->
  <line x1="256" y1="256" x2="200" y2="165" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="274" y2="285" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="14" fill="#0284c7"/>
  <circle cx="256" cy="256" r="6" fill="#38bdf8"/>
  <circle cx="200" cy="165" r="4" fill="#34d399"/>
</svg>
